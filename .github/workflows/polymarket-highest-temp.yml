name: Polymarket Highest Temp Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_polymarket_highest_temp_tracker_v2.txt

      - name: Create data folder
        run: mkdir -p data

      - name: Run tracker once
        run: |
          python polymarket_highest_temp_tracker_v2.py run-once --db data/polymarket_highest_temp.db

      - name: Export CSV snapshots
        run: |
          python polymarket_highest_temp_tracker_v2.py export-csv --db data/polymarket_highest_temp.db --out data/snapshots.csv
          python polymarket_highest_temp_tracker_v2.py export-picks-csv --db data/polymarket_highest_temp.db --out data/picks.csv

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update tracker data"
          git push
